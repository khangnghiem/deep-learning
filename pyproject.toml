[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-learning"
version = "0.1.0"
description = "Deep learning experiments and training framework"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "polars>=0.20.0",
    "pyyaml>=6.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
    "opencv-python>=4.9.0",
    "Pillow>=10.0.0",
    "albumentations>=1.3.0",
    "transformers>=4.36.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "mlflow>=2.9.0",
    "tensorboard>=2.14.0",
    "pytorch-lightning>=2.1.0",
    "tqdm>=4.65.0",
    "hydra-core>=1.3.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "altair>=5.2.0",
    "ipykernel>=6.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
