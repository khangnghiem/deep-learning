experiment_name: "058_polyp_sam2_finetune_decoder_focal"
model:
  type: "sam2_hiera_small"
  checkpoint: "sam2_hiera_small.pt"
  model_cfg: "sam2_hiera_s.yaml"
lora:
  target: "mask_decoder"
  r: 16
  lora_alpha: 32
  target_modules: "all-linear"
  lora_dropout: 0.05
training:
  epochs: 5
  lr: 0.0001
  weight_decay: 0.0001
  loss: "bce_focal"
data:
  dataset_dir: "/content/drive/MyDrive/data_lake/03_gold/016_polyp_fast_diag_dataset"
  yolo_model: "/content/drive/MyDrive/models/trained/025_polyp_yolov12x_aug/train/weights/best.pt"
